spring:
  cloud:
    gateway:
      routes:
      - id: bluesky-api-bookkeeping
        uri: https://bookkeeping.api.bluesky.local
        predicates:
        - Path=/api/bookkeeping,/api/bookkeeping/**
      - id: bluesky-api-user
        uri: https://user.api.bluesky.local
        predicates:
        - Path=/api/user,/api/user/**