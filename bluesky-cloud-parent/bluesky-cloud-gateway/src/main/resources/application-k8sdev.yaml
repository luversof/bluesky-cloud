spring:
  cloud:
    gateway:
      # Spring Cloud 2025부터 Forwarded/X-Forwarded 헤더 필터는 trusted-proxies가 설정돼야 동작한다.
      # 미설정 시 게이트웨이가 X-Forwarded-Host를 추가하지 않아, 다운스트림(web-user)의 OAuth2
      # redirect_uri가 외부 도메인 대신 내부 서비스명(svc.cluster.local)으로 생성된다.
      # 값은 게이트웨이로 접속하는 직전 프록시(Traefik 등) IP 대역에 맞게 조정할 것.
      server.webflux.trusted-proxies: "10\\..*"
      # 다운스트림에 원본 Host(admin.cloud.bluesky.local 등)를 그대로 전달한다.
      # 미설정 시 Host 가 lb 대상인 내부 서비스명(svc.cluster.local)으로 바뀐다.
      # Spring Boot Admin UI 는 이 Host 로 <base href> 를 만들기 때문에, 브라우저가
      # 내부 DNS 를 못 찾아 자산을 전혀 못 받고 빈 화면이 된다.
      # (X-Forwarded-Host 는 trusted-proxies 덕에 정상 전달되지만, 그것만으로는
      #  이 증상이 해결되지 않아 Host 자체를 보존해야 했다)
      server.webflux.default-filters:
      - PreserveHostHeader
      server.webflux.routes:
      - id: bluesky-api-blog
        uri: lb://bluesky-api-blog-service
        predicates:
        - Host=blog.api.bluesky.local
      - id: bluesky-api-board
        uri: lb://bluesky-api-board-service
        predicates:
        - Host=board.api.bluesky.local
      - id: bluesky-api-bookkeeping
        uri: lb://bluesky-api-bookkeeping-service
        predicates:
        - Host=bookkeeping.api.bluesky.local
      - id: bluesky-api-poe
        uri: lb://bluesky-api-poe-service
        predicates:
        - Host=poe.api.bluesky.local
      - id: bluesky-api-stock
        uri: lb://bluesky-api-stock-service
        predicates:
        - Host=stock.api.bluesky.local
      - id: bluesky-api-user
        uri: lb://bluesky-api-user-service
        predicates:
        - Host=user.api.bluesky.local
      - id: bluesky-cloud-admin-server
        uri: lb://bluesky-cloud-admin-server-service
        predicates:
        - Host=admin.cloud.bluesky.local
      - id: bluesky-cloud-config-server
        uri: lb://bluesky-cloud-config-server-service
        predicates:
        - Host=config.cloud.bluesky.local
      - id: bluesky-cloud-netflix-eureka-server-1
        uri: lb://bluesky-cloud-netflix-eureka-server-1-service
        predicates:
        - Host=eureka1.cloud.bluesky.local
      - id: bluesky-cloud-netflix-eureka-server-2
        uri: lb://bluesky-cloud-netflix-eureka-server-2-service
        predicates:
        - Host=eureka2.cloud.bluesky.local
      - id: bluesky-web-gate
        uri: lb://bluesky-web-gate-service
        predicates:
        - Host=gate.web.bluesky.local
      - id: bluesky-web-swagger-ui
        uri: lb://bluesky-web-swagger-ui-service
        predicates:
        - Host=swagger.web.bluesky.local
      - id: bluesky-web-user
        uri: lb://bluesky-web-user-service
        predicates:
        - Host=user.web.bluesky.local